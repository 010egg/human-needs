name: Triage need
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'need')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/scripts/triage.js`);
            const res = await triage.run({ github, context });
            core.info(JSON.stringify(res));
